# Netlify builds and deploys every push to dev (the production branch, set in the Netlify UI).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The real backend, on the page's own origin (the front door answers no CORS preflight). Switch on
# together with VITE_API_URL=/api in the Netlify UI, once the page has a token source (docs/product.md).
# [[redirects]]
#   from = "/api/*"
#   to = "https://scam-check.dev1.whalebone.io/:splat"
#   status = 200
#   force = true

# PoC: keep the site out of search engines. Remove at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
