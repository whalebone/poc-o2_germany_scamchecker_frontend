# Netlify builds and deploys every push to dev (the production branch, set in the Netlify UI).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The real backend: netlify/functions/api.mjs answers /api/* and adds the token. It's on once the Netlify UI
# has VITE_API_URL=/api (build), SCAM_CHECK_URL and SCAM_CHECK_TOKEN (functions); without them the page is the demo.

# PoC: keep the site out of search engines. Remove at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
