<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000}
  body{font-family:var(--font-sans)}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#00008C 0%,#0050FF 70%,#2B7BFF 100%);padding:96px 80px;box-sizing:border-box}
  .logo{position:absolute;top:48px;right:62px;height:100px;z-index:5}
  .num{font-weight:900;font-size:280px;line-height:.85;letter-spacing:-.02em;margin:0}
  .lbl{font-weight:700;font-size:42px;line-height:1.1;margin-top:8px;max-width:720px}
  .meta{font-size:18px;opacity:.8;margin-top:18px;max-width:600px;line-height:1.4}
  .b1{position:absolute;right:-60px;top:-40px;width:300px;opacity:.55;filter:blur(1px)}
  .b2{position:absolute;right:60px;bottom:60px;width:160px;opacity:.4;filter:blur(2px)}
</style></head><body>
<div class="slide" data-screen-label="03 Stat">
  <img class="logo" src="../assets/logo/o2_Logo_White.svg">
  <img class="b1" src="../assets/bubbles/o2_Bubble_05.png">
  <img class="b2" src="../assets/bubbles/o2_Bubble_07.png">
  <div class="num">99 %</div>
  <div class="lbl">Netzabdeckung in Deutschland.</div>
  <div class="meta">Stand: Q1 2026 · Bundesnetzagentur-Messungen · O₂ Mobilfunknetz.</div>
</div>
</body></html>
