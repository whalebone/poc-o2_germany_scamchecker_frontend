<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000}
  body{font-family:var(--font-sans)}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#00008C 0%,#0050FF 60%,#2B7BFF 100%);padding:96px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  .logo{position:absolute;top:48px;right:64px;height:120px;z-index:5}
  h1{font-weight:900;font-size:120px;line-height:.95;letter-spacing:-.01em;margin:0 0 28px}
  p{font-size:24px;line-height:1.4;opacity:.92;max-width:780px;margin:0 0 40px}
  .row{display:flex;gap:18px}
  .btn{background:#fff;color:#0050FF;border:0;padding:18px 32px;border-radius:999px;font-family:inherit;font-weight:700;font-size:18px;cursor:pointer}
  .btn.ghost{background:transparent;color:#fff;border:2px solid #fff;padding:16px 30px}
  .b1{position:absolute;right:-120px;bottom:-160px;width:580px;filter:drop-shadow(0 30px 60px rgba(0,0,80,.35))}
</style></head><body>
<div class="slide" data-screen-label="07 Closing">
  <img class="logo" src="../assets/logo/o2_Logo_White.svg">
  <img class="b1" src="../assets/bubbles/o2_Bubble_Stage_1_1.png">
  <h1>Vielen Dank.</h1>
  <p>Fragen, Feedback, Mitgestalten — schreib uns: branding-de@telefonica.com</p>
  <div class="row"><button class="btn">Brand Factory öffnen</button><button class="btn ghost">Asset herunterladen</button></div>
</div>
</body></html>
